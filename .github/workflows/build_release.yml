name: Build and Release
on:
  push:
    branches:
      - develop
      - release
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-2022

    env:
      RELEASE_CHANGES: changes.md
      SOLUTION_SERVICE: prs_service\PrsService.sln
      SERVICE_BUILD_DIR: prs_service\Prs.App.Service\bin\Release\net8.0-windows\win-x64
      SERVER_EXE_FILE: prs_app_wpf\publish\service\Prs.App.Service.exe
      RELEASE_SUFFIX: none
      RELEASE_PRE: none
      RELEASE_KIND: none
      RELEASE_VERSION: none
      # alpha/beta/stable nas branches de release; "dev" em validações (workflow_dispatch em outras branches).
      RELEASE_CHANNEL: dev
      FIRMWARE_CHANNEL: latest-stable.json
      FIRMWARE_BASE_DIR: prs_app_wpf\publish\firmwares
      FIRMWARE_RELEASE_REPO: https://raw.githubusercontent.com/proracingsimulators/prs_fw_release
      # Pacote do app: PRS.exe (WPF, framework-dependent .NET 9) + service\ (prs_service).
      WPF_PROJECT: prs_app_wpf\src\Prs.Wpf\Prs.Wpf.csproj
      WPF_RELEASE_DIRECTORY: prs_app_wpf\publish
      WPF_ZIP_FILENAME: prs_app_wpf.zip
      WPF_EXE_FILE: prs_app_wpf\publish\PRS.exe
      # Instalador (prs_app_wpf/installer/Prs.Setup): single-file self-contained com o
      # prs_app_wpf.zip embutido; vai para o release dentro de um zip próprio.
      SETUP_PROJECT: prs_app_wpf\installer\Prs.Setup\Prs.Setup.csproj
      SETUP_RELEASE_DIRECTORY: setup_publish
      SETUP_EXE_FILENAME: PRS.Setup.exe
      SETUP_ZIP_FILENAME: prs_setup.zip

    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 0

    - name: Setup .NET 9 SDK (prs_app_wpf)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Set alpha env (develop branch)
      if: github.ref == 'refs/heads/develop'
      shell: pwsh
      run: |
        echo "RELEASE_PRE=true" >> $env:GITHUB_ENV
        echo "RELEASE_SUFFIX=-alpha" >> $env:GITHUB_ENV
        echo "RELEASE_CHANNEL=alpha" >> $env:GITHUB_ENV
        echo "RELEASE_KIND=pre-release (alpha)" >> $env:GITHUB_ENV
        echo "FIRMWARE_CHANNEL=latest-alpha.json" >> $env:GITHUB_ENV

    - name: Set beta env (release branch)
      if: github.ref == 'refs/heads/release'
      shell: pwsh
      run: |
        echo "RELEASE_PRE=true" >> $env:GITHUB_ENV
        echo "RELEASE_SUFFIX=-beta" >> $env:GITHUB_ENV
        echo "RELEASE_CHANNEL=beta" >> $env:GITHUB_ENV
        echo "RELEASE_KIND=pre-release (beta)" >> $env:GITHUB_ENV
        echo "FIRMWARE_CHANNEL=latest-beta.json" >> $env:GITHUB_ENV

    - name: Set stable env (main branch)
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        echo "RELEASE_PRE=false" >> $env:GITHUB_ENV
        echo "RELEASE_SUFFIX=" >> $env:GITHUB_ENV
        echo "RELEASE_CHANNEL=stable" >> $env:GITHUB_ENV
        echo "RELEASE_KIND=stable release" >> $env:GITHUB_ENV
        echo "FIRMWARE_CHANNEL=latest-stable.json" >> $env:GITHUB_ENV

    - name: Build prs_service Solution
      shell: pwsh
      run: |
        nuget restore "${{ env.SOLUTION_SERVICE }}"
        & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" "${{ env.SOLUTION_SERVICE }}" /p:Configuration=Release /p:Platform="Any CPU"
        if ($LASTEXITCODE -ne 0) {
          throw "Build do prs_service falhou com código $LASTEXITCODE"
        }

        if (-not (Test-Path "${{ github.workspace }}\${{ env.SERVICE_BUILD_DIR }}")) {
          throw "Service build output directory not found: ${{ env.SERVICE_BUILD_DIR }}"
        }

    - name: Set Release Version
      shell: pwsh
      run: |
        # Major.minor vem do prs_app_wpf (Directory.Build.props); build/revisão seguem o
        # esquema do antigo AssemblyVersion("0.18.*") do prs_app: dias desde 2000-01-01 e
        # segundos desde a meia-noite / 2 (UTC no runner).
        $props = "${{ github.workspace }}\prs_app_wpf\Directory.Build.props"
        $prefix = (Select-Xml -Path $props -XPath '//PrsVersionPrefix').Node.InnerText
        if (-not $prefix) {
          throw "PrsVersionPrefix não encontrado em $props"
        }

        $now = [DateTime]::UtcNow
        $build = ($now.Date - [DateTime]::new(2000, 1, 1)).Days
        $revision = [int][Math]::Floor($now.TimeOfDay.TotalSeconds / 2)
        $versionString = "$prefix.$build.$revision"
        Write-Host "Release version: $versionString"
        echo "RELEASE_VERSION=$versionString" >> $env:GITHUB_ENV

    - name: Publish prs_app_wpf
      shell: pwsh
      run: |
        $publishDir = "${{ github.workspace }}\${{ env.WPF_RELEASE_DIRECTORY }}"
        if (Test-Path $publishDir) {
          Remove-Item $publishDir -Recurse -Force
        }

        # Framework-dependent: exige o .NET 9 Desktop Runtime na máquina de destino.
        dotnet publish "${{ env.WPF_PROJECT }}" -c Release -r win-x64 --self-contained false -p:Version=${{ env.RELEASE_VERSION }} -o $publishDir
        if ($LASTEXITCODE -ne 0) {
          throw "dotnet publish do prs_app_wpf falhou com código $LASTEXITCODE"
        }

        $serviceOut = Join-Path $publishDir 'service'
        New-Item -ItemType Directory -Force -Path $serviceOut | Out-Null
        Copy-Item -Path (Join-Path "${{ github.workspace }}\${{ env.SERVICE_BUILD_DIR }}" '*') -Destination $serviceOut -Recurse -Force

        foreach ($required in @("${{ env.WPF_EXE_FILE }}", "${{ env.WPF_RELEASE_DIRECTORY }}\service\Prs.App.Service.exe")) {
          if (-not (Test-Path "${{ github.workspace }}\$required")) {
            throw "Arquivo esperado no pacote do prs_app_wpf não encontrado: $required"
          }
        }

    - name: Synchronize firmwares
      shell: pwsh
      run: |
        $firmwareBaseDir = "${{ github.workspace }}\${{ env.FIRMWARE_BASE_DIR }}"
        $releaseFile = "${{ env.FIRMWARE_CHANNEL }}"
        $releaseRepo = "${{ env.FIRMWARE_RELEASE_REPO }}"

        $devices = @(
          @{ Name = "MotionPRS";   MetadataUrl = "$releaseRepo/refs/heads/main/v1/prs-motion/metadata.json" },
          @{ Name = "PedalPRS";    MetadataUrl = "$releaseRepo/refs/heads/main/v1/prs-pedal/metadata.json" },
          @{ Name = "SeatBeltPRS"; MetadataUrl = "$releaseRepo/refs/heads/main/v1/prs-seat-belt/metadata.json" },
          @{ Name = "SWheelPRS";   MetadataUrl = "$releaseRepo/refs/heads/main/v1/prs-steering-wheel/metadata.json" }
        )

        $failedDevices = @()

        foreach ($device in $devices) {
          $deviceDir = Join-Path $firmwareBaseDir $device.Name
          Write-Host "Synchronizing firmwares for $($device.Name)..."

          try {
            if (-not (Test-Path $deviceDir)) {
              New-Item -ItemType Directory -Path $deviceDir -Force | Out-Null
            }

            $metadata = Invoke-RestMethod -Uri $device.MetadataUrl -Headers @{ "User-Agent" = "ProRacingSoftware" }
            $folders = $metadata.folders

            if (-not $folders -or $folders.Count -eq 0) {
              Write-Host "No firmware folders found for $($device.Name), skipping."
              continue
            }

            $baseUrl = $device.MetadataUrl.Substring(0, $device.MetadataUrl.LastIndexOf('/') + 1)

            foreach ($folder in $folders) {
              $fileUrl = "$baseUrl$folder/$releaseFile"
              $filePath = Join-Path $deviceDir "$folder.json"
              Write-Host "  Downloading $fileUrl -> $filePath"
              Invoke-WebRequest -Uri $fileUrl -Headers @{ "User-Agent" = "ProRacingSoftware" } -OutFile $filePath
            }

            $metadataPath = Join-Path $deviceDir "metadata.json"
            $metadata | ConvertTo-Json -Depth 10 | Out-File -FilePath $metadataPath -Encoding utf8

            Write-Host "Firmwares for $($device.Name) synchronized successfully."
          }
          catch {
            Write-Host "::error::Failed to synchronize firmwares for $($device.Name): $_"
            $failedDevices += $device.Name
          }
        }

        if ($failedDevices.Count -gt 0) {
          throw "Firmware synchronization failed for: $($failedDevices -join ', ')"
        }

    - name: Create changes.md if not exists
      shell: pwsh
      run: |
        $changesPath = "${{ github.workspace }}\${{ env.RELEASE_CHANGES }}"
        if (-not (Test-Path $changesPath)) {
          "# Release Notes" | Out-File -FilePath $changesPath -Encoding utf8
          "" | Out-File -FilePath $changesPath -Encoding utf8 -Append
          "## Changes" | Out-File -FilePath $changesPath -Encoding utf8 -Append
          "" | Out-File -FilePath $changesPath -Encoding utf8 -Append
          "### prs_app_wpf" | Out-File -FilePath $changesPath -Encoding utf8 -Append
          "- Build from commit: ${{ github.sha }}" | Out-File -FilePath $changesPath -Encoding utf8 -Append
          "- Branch: ${{ github.ref_name }}" | Out-File -FilePath $changesPath -Encoding utf8 -Append
          "" | Out-File -FilePath $changesPath -Encoding utf8 -Append
          "### prs_service" | Out-File -FilePath $changesPath -Encoding utf8 -Append
          "- Build from submodule" | Out-File -FilePath $changesPath -Encoding utf8 -Append
        }

    - name: Update changes.md with version and date
      shell: pwsh
      run: |
        $releaseVersion = "${{ env.RELEASE_VERSION }}${{ env.RELEASE_SUFFIX }}"
        $releaseDate = Get-Date -Format "dd-MM-yyyy"
        (Get-Content ${{ env.RELEASE_CHANGES }}) -replace "\[\{version\}\]", "[$releaseVersion]" `
                                                 -replace "\{version\}", "$releaseVersion" `
                                                 -replace "\{date\}", "$releaseDate" | Set-Content ${{ env.RELEASE_CHANGES }}

    - name: Add prs_app_wpf changes to changes.md
      shell: pwsh
      run: |
        $releaseVersion = "${{ env.RELEASE_VERSION }}${{ env.RELEASE_SUFFIX }}"
        $releaseDate = Get-Date -Format "dd-MM-yyyy"
        $wpfChangesPath = "${{ github.workspace }}\prs_app_wpf\changes.md"

        if (Test-Path $wpfChangesPath) {
          Write-Host "Found prs_app_wpf changes.md, processing and appending to release notes..."

          $wpfContent = Get-Content $wpfChangesPath -Raw
          $wpfContent = $wpfContent -replace "\[\{version\}\]", "[$releaseVersion]" `
                                   -replace "\{version\}", "$releaseVersion" `
                                   -replace "\{date\}", "$releaseDate"

          "`n---`n" | Out-File -FilePath "${{ env.RELEASE_CHANGES }}" -Encoding utf8 -Append
          $wpfContent | Out-File -FilePath "${{ env.RELEASE_CHANGES }}" -Encoding utf8 -Append
        } else {
          Write-Host "No changes.md found in prs_app_wpf submodule"
        }

    - name: Add prs_service changes to changes.md
      shell: pwsh
      run: |
        $serviceChangesPath = "${{ github.workspace }}\prs_service\changes.md"
        
        if (Test-Path $serviceChangesPath) {
          Write-Host "Found prs_service changes.md, processing and appending to release notes..."
          
          # Obtém a versão do executável do serviço
          $serverExePath = "${{ github.workspace }}\${{ env.SERVER_EXE_FILE }}"
          if (Test-Path $serverExePath) {
            $serviceVersion = (Get-Item $serverExePath).VersionInfo.FileVersion
            Write-Host "Service version from executable: $serviceVersion"
          } else {
            Write-Host "Warning: Service executable not found at $serverExePath, using app version"
            $serviceVersion = "${{ env.RELEASE_VERSION }}"
          }
          
          $releaseDate = Get-Date -Format "dd-MM-yyyy"
          
          # Read and process the service changes file
          $serviceContent = Get-Content $serviceChangesPath -Raw
          $serviceContent = $serviceContent -replace "\[\{version\}\]", "[$serviceVersion]" `
                                           -replace "\{version\}", "$serviceVersion" `
                                           -replace "\{date\}", "$releaseDate"
          
          # Append to main changes file
          "`n---`n" | Out-File -FilePath "${{ env.RELEASE_CHANGES }}" -Encoding utf8 -Append
          $serviceContent | Out-File -FilePath "${{ env.RELEASE_CHANGES }}" -Encoding utf8 -Append
        } else {
          Write-Host "No changes.md found in prs_service submodule"
        }

    - name: Archive prs_app_wpf build
      shell: pwsh
      run: |
        $zipPath = "${{ github.workspace }}\${{ env.WPF_ZIP_FILENAME }}"
        $sourcePath = "${{ github.workspace }}\${{ env.WPF_RELEASE_DIRECTORY }}"
        if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
        }
        Compress-Archive -Path $sourcePath\* -DestinationPath $zipPath -Force

    - name: Publish installer
      shell: pwsh
      run: |
        $publishDir = "${{ github.workspace }}\${{ env.SETUP_RELEASE_DIRECTORY }}"
        if (Test-Path $publishDir) {
          Remove-Item $publishDir -Recurse -Force
        }

        # Self-contained: o instalador roda antes de existir qualquer runtime .NET na máquina.
        # O prs_app_wpf.zip deste build vai embutido (PrsPayloadZip).
        dotnet publish "${{ env.SETUP_PROJECT }}" -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
          -p:DebugType=none -p:Version=${{ env.RELEASE_VERSION }} -p:PrsChannel=${{ env.RELEASE_CHANNEL }} `
          "-p:PrsPayloadZip=${{ github.workspace }}\${{ env.WPF_ZIP_FILENAME }}" -o $publishDir
        if ($LASTEXITCODE -ne 0) {
          throw "dotnet publish do instalador falhou com código $LASTEXITCODE"
        }

        $setupExe = Join-Path $publishDir "${{ env.SETUP_EXE_FILENAME }}"
        if (-not (Test-Path $setupExe)) {
          throw "Instalador não encontrado: $setupExe"
        }

        $zipPath = "${{ github.workspace }}\${{ env.SETUP_ZIP_FILENAME }}"
        if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
        }
        Compress-Archive -Path $setupExe -DestinationPath $zipPath -Force

    - name: Check if should create release
      id: check_release
      shell: pwsh
      run: |
        $shouldRelease = $true
        
        # Verifica a mensagem do commit principal (head commit ou merge commit)
        $commitMessage = "${{ github.event.head_commit.message }}"
        Write-Host "Head commit message: $commitMessage"
        
        # Releases só são criadas a partir de develop/release/main. Em outras branches
        # (ex.: workflow_dispatch para validação) os pacotes ficam apenas como artifacts.
        if ("${{ github.ref }}" -notin @("refs/heads/develop", "refs/heads/release", "refs/heads/main")) {
          $shouldRelease = $false
          Write-Host "Branch ${{ github.ref_name }} is not a release branch - skipping release creation"
        }
        # Se contém [skip-release] na mensagem do merge/commit principal, não cria release
        elseif ($commitMessage -match "\[skip-release\]") {
          $shouldRelease = $false
          Write-Host "Found [skip-release] tag in head commit - skipping release creation"
        }
        else {
          # Se for um merge commit, verifica também os commits individuais
          if ($commitMessage -match "^Merge pull request" -or $commitMessage -match "^Merge branch") {
            Write-Host "Detected merge commit, checking individual commits in the push..."
            
            # Obtém todos os commits deste push
            $commits = git log --format=%B ${{ github.event.before }}..${{ github.event.after }}
            Write-Host "Commits in this push:"
            Write-Host $commits
            
            # Se QUALQUER commit tiver [skip-release], não cria release
            if ($commits -match "\[skip-release\]") {
              $shouldRelease = $false
              Write-Host "Found [skip-release] tag in one or more commits - skipping release creation"
            }
            else {
              Write-Host "No [skip-release] tag found in any commit - will create release"
            }
          }
          else {
            Write-Host "No [skip-release] tag found - will create release"
          }
        }
        
        echo "should_release=$shouldRelease" >> $env:GITHUB_OUTPUT
        Write-Host "Final decision - Should create release: $shouldRelease"

    - name: Delete existing release if exists
      if: steps.check_release.outputs.should_release == 'true'
      shell: pwsh
      run: |
        $tagName = "v${{ env.RELEASE_VERSION }}${{ env.RELEASE_SUFFIX }}"
        $releaseApi = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tagName"
        
        try {
          $release = Invoke-RestMethod -Uri $releaseApi -Headers @{Authorization = "token ${{ secrets.GITHUB_TOKEN }}"} -Method Get
          if ($release) {
            Write-Host "Found existing release with tag $tagName, deleting..."
            $deleteUri = "https://api.github.com/repos/${{ github.repository }}/releases/$($release.id)"
            Invoke-RestMethod -Uri $deleteUri -Headers @{Authorization = "token ${{ secrets.GITHUB_TOKEN }}"} -Method Delete
            Write-Host "Release deleted successfully"
            
            # Also delete the tag
            $tagDeleteUri = "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$tagName"
            try {
              Invoke-RestMethod -Uri $tagDeleteUri -Headers @{Authorization = "token ${{ secrets.GITHUB_TOKEN }}"} -Method Delete
              Write-Host "Tag deleted successfully"
            } catch {
              Write-Host "Tag deletion failed or tag doesn't exist: $_"
            }
          }
        } catch {
          Write-Host "No existing release found with tag $tagName or error occurred: $_"
        }

    - name: Create release
      if: steps.check_release.outputs.should_release == 'true'
      uses: softprops/action-gh-release@v1
      with:
        prerelease: ${{ env.RELEASE_PRE }}
        body_path: ${{ github.workspace }}\${{ env.RELEASE_CHANGES }}
        name: ${{ env.RELEASE_KIND }} v${{ env.RELEASE_VERSION }}${{ env.RELEASE_SUFFIX }}
        tag_name: v${{ env.RELEASE_VERSION }}${{ env.RELEASE_SUFFIX }}
        files: |
          ${{ env.WPF_ZIP_FILENAME }}
          ${{ env.SETUP_ZIP_FILENAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload packages as artifact
      if: ${{ !contains(fromJSON('["refs/heads/develop", "refs/heads/release", "refs/heads/main"]'), github.ref) }}
      uses: actions/upload-artifact@v4
      with:
        # Sem o nome da branch: upload-artifact rejeita "/" (ex.: feature/PRS-776).
        name: prs_app_wpf-run${{ github.run_number }}-${{ github.run_attempt }}
        retention-days: 7
        path: |
          ${{ env.WPF_ZIP_FILENAME }}
          ${{ env.SETUP_ZIP_FILENAME }}